{% extends "base.html" %}
{% block title %}O'chirishni tasdiqlash{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <div class="card-body">
    <h1>O'chirishni tasdiqlang</h1>
    <p>«<strong>{{ object }}</strong>» butunlay o'chiriladi. Bu amalni qaytarib bo'lmaydi.</p>
    <form method="post" class="actions">{% csrf_token %}
      <button class="btn btn-danger solid" type="submit">Ha, o'chirish</button>
      <a class="btn" href="#" data-back>Bekor qilish</a>
    </form>
  </div>
</div>
{% endblock %}
