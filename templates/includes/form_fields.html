{% if form.non_field_errors %}<div class="msg error" style="margin-bottom:16px">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field {% if field.errors %}has-error{% endif %} {% if field.widget_type == 'textarea' or field.widget_type == 'clearablefile' %}wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<span class="err">{{ e }}</span>{% endfor %}
</div>
{% endfor %}
